      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      REPLICA_ID: mysql-3
      PORT: 3000
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3313:3000"
