name: MySQL compatibility

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  e2e-mysql-mysql2:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.4
            image: docker.io/library/mysql:8.4
          - name: MariaDB 11.8
            image: docker.io/library/mariadb:11.8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: mysql2 e2e (${{ matrix.name }})
        env:
          MYSQL_IMAGE: ${{ matrix.image }}
        run: npm run test:e2e:mysql:mysql2
