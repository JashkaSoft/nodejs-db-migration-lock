name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test

  # node × database image. setup-node only runs npm; NODE_VERSION selects the suite image.
  # ORM suites stay on the current server. They call the same dialect lock.
  # Oracle Free 23 is the only image whose service name matches that suite.
  # SQLite's engine is the Node image, so it has no second server tag.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26]
        target:
          - name: PostgreSQL 18
            run: npm run test:e2e:postgres:node-pg
            image_env: POSTGRES_IMAGE
            image: docker.io/library/postgres:18-alpine
          - name: PostgreSQL 17
            run: npm run test:e2e:postgres:node-pg
            image_env: POSTGRES_IMAGE
            image: docker.io/library/postgres:17-alpine
          - name: MySQL 9.7
            run: npm run test:e2e:mysql:mysql2
            image_env: MYSQL_IMAGE
            image: docker.io/library/mysql:9.7
          - name: MySQL 8.4
            run: npm run test:e2e:mysql:mysql2
            image_env: MYSQL_IMAGE
            image: docker.io/library/mysql:8.4
          - name: MariaDB 11.8
            run: npm run test:e2e:mysql:mysql2
            image_env: MYSQL_IMAGE
            image: docker.io/library/mariadb:11.8
          - name: MariaDB 10.11
            run: npm run test:e2e:mysql:mysql2
            image_env: MYSQL_IMAGE
            image: docker.io/library/mariadb:10.11
          - name: SQL Server 2022
            run: npm run test:e2e:mssql:tedious
            image_env: MSSQL_IMAGE
            image: mcr.microsoft.com/mssql/server:2022-latest
          - name: SQL Server 2019
            run: npm run test:e2e:mssql:tedious
            image_env: MSSQL_IMAGE
            image: mcr.microsoft.com/mssql/server:2019-latest
          - name: CockroachDB 25.4
            run: npm run test:e2e:cockroach:pg
            image_env: COCKROACH_IMAGE
            image: docker.io/cockroachdb/cockroach:v25.4.18
          - name: CockroachDB 24.3
            run: npm run test:e2e:cockroach:pg
            image_env: COCKROACH_IMAGE
            image: docker.io/cockroachdb/cockroach:v24.3.37
          - name: YugabyteDB 2026.1
            run: npm run test:e2e:yugabyte:pg
            image_env: YUGABYTE_IMAGE
            image: docker.io/yugabytedb/yugabyte:2026.1.2.0-b137
          - name: YugabyteDB 2025.2
            run: npm run test:e2e:yugabyte:pg
            image_env: YUGABYTE_IMAGE
            image: docker.io/yugabytedb/yugabyte:2025.2.8.0-b60
          - name: Oracle 23
            run: npm run test:e2e:oracle:oracledb
            image_env: ""
            image: ""
          - name: SQLite
            run: npm run test:e2e:sqlite:node-sqlite
            image_env: ""
            image: ""
          - name: TypeORM PostgreSQL 18
            run: npm run test:e2e:typeorm:postgres
            image_env: ""
            image: ""
          - name: TypeORM MySQL 9.7
            run: npm run test:e2e:typeorm:mysql
            image_env: ""
            image: ""
          - name: Sequelize PostgreSQL 18
            run: npm run test:e2e:sequelize:postgres
            image_env: ""
            image: ""
          - name: Sequelize MySQL 9.7
            run: npm run test:e2e:sequelize:mysql
            image_env: ""
            image: ""
          - name: MikroORM PostgreSQL 18
            run: npm run test:e2e:mikroorm:postgres
            image_env: ""
            image: ""
          - name: Kysely PostgreSQL 18
            run: npm run test:e2e:kysely:postgres
            image_env: ""
            image: ""
    name: e2e / ${{ matrix.target.name }} / node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: ${{ matrix.target.name }}
        run: |
          export NODE_VERSION="${{ matrix.node }}"
          image_env="${{ matrix.target.image_env }}"
          if [ -n "$image_env" ]; then
            export "$image_env"="${{ matrix.target.image }}"
          fi
          ${{ matrix.target.run }}
