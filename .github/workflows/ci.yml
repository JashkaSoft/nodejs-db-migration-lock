name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install
      - run: npm run build
      - run: npm test

  e2e-postgres-node-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: PostgreSQL node-pg e2e
        run: npm run test:e2e:postgres:node-pg

  e2e-typeorm-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: TypeORM PostgreSQL e2e
        run: npm run test:e2e:typeorm:postgres

  e2e-typeorm-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: TypeORM MySQL e2e
        run: npm run test:e2e:typeorm:mysql

  e2e-sequelize-postgres:
