name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: .github/ci-path-filters.yml
      - name: Compute CI plan from path filters
        id: plan
        env:
          E2E_NODE_VERSION: "26"
          FILTER_CODE: ${{ steps.filter.outputs.code }}
          FILTER_DOCS: ${{ steps.filter.outputs.docs }}
          FILTER_GLOBAL: ${{ steps.filter.outputs.global }}
          FILTER_CORE: ${{ steps.filter.outputs.core }}
          FILTER_POSTGRES: ${{ steps.filter.outputs.postgres }}
          FILTER_MYSQL: ${{ steps.filter.outputs.mysql }}
          FILTER_MSSQL: ${{ steps.filter.outputs.mssql }}
          FILTER_COCKROACH: ${{ steps.filter.outputs.cockroach }}
          FILTER_YUGABYTE: ${{ steps.filter.outputs.yugabyte }}
          FILTER_ORACLE: ${{ steps.filter.outputs.oracle }}
          FILTER_SQLITE: ${{ steps.filter.outputs.sqlite }}
          FILTER_TYPEORM: ${{ steps.filter.outputs.typeorm }}
          FILTER_SEQUELIZE: ${{ steps.filter.outputs.sequelize }}
          FILTER_MIKROORM: ${{ steps.filter.outputs.mikroorm }}
          FILTER_KYSELY: ${{ steps.filter.outputs.kysely }}
          FILTER_KNEX: ${{ steps.filter.outputs.knex }}
        run: bash .github/scripts/compute-ci-plan.sh

  test:
    needs: changes
    if: needs.changes.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test

  # E2e rows: .github/e2e-targets.json + paths-filter + build-e2e-matrix.js
  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    name: e2e / ${{ matrix.name }} / node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: ${{ matrix.name }}
        run: |
          export NODE_VERSION="${{ matrix.node }}"
          image_env="${{ matrix.image_env }}"
          if [ -n "$image_env" ]; then
            export "$image_env"="${{ matrix.image }}"
          fi
          ${{ matrix.run }}
