        run: npm run test:e2e:sequelize:mysql

  e2e-sqlite-node-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: SQLite node:sqlite e2e
        run: npm run test:e2e:sqlite:node-sqlite

  e2e-mysql-mysql2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: MySQL mysql2 e2e
        run: npm run test:e2e:mysql:mysql2

  e2e-mssql-tedious:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: SQL Server tedious e2e
        run: npm run test:e2e:mssql:tedious

  e2e-cockroach-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: CockroachDB pg e2e
        run: npm run test:e2e:cockroach:pg

  e2e-yugabyte-pg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: YugabyteDB pg e2e
        run: npm run test:e2e:yugabyte:pg

  e2e-oracle-oracledb:
