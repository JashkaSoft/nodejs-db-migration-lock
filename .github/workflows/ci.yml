name: CI

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      run_unit: ${{ steps.plan.outputs.run_unit }}
      run_e2e: ${{ steps.plan.outputs.run_e2e }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute CI plan from changed paths
        id: plan
        env:
          E2E_NODE_VERSION: "26"
        run: |
          git fetch origin "${{ github.base_ref }}"
          bash .github/scripts/compute-ci-plan.sh "origin/${{ github.base_ref }}"

  test:
    needs: changes
    if: needs.changes.outputs.run_unit == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test

  # node × database image. Matrix rows come from .github/e2e-targets.json and
  # .github/scripts/compute-ci-plan.sh (only packages touched by the PR).
  e2e:
    needs: changes
    if: needs.changes.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.e2e_matrix) }}
    name: e2e / ${{ matrix.name }} / node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: ${{ matrix.name }}
        run: |
          export NODE_VERSION="${{ matrix.node }}"
          image_env="${{ matrix.image_env }}"
          if [ -n "$image_env" ]; then
            export "$image_env"="${{ matrix.image }}"
          fi
          ${{ matrix.run }}
