name: Version

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Bump versions, tag packages, push to main
        run: |
          git config user.name "Insidexa"
          git config user.email "6715948+Insidexa@users.noreply.github.com"
          npx lerna version --yes --no-private --create-release github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
